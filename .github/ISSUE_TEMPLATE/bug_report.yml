name: Báo lỗi
description: Báo hành vi sai bằng dữ liệu tổng hợp, không chứa PII hoặc secret.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã báo lỗi. Nếu đây là lỗ hổng bảo mật, **không gửi form này**;
        hãy làm theo SECURITY.md và dùng private vulnerability reporting.
  - type: checkboxes
    id: privacy
    attributes:
      label: Kiểm tra an toàn
      options:
        - label: Tôi không đính kèm dữ liệu khách hàng, PII, credential hoặc connection string.
          required: true
        - label: Tôi đã tìm issue trùng và đọc tài liệu/giới hạn hiện tại.
          required: true
  - type: input
    id: version
    attributes:
      label: Phiên bản VietClean và Python
      description: Ví dụ `vietclean 0.1.0, Python 3.12.4`.
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Định dạng dữ liệu
      options:
        - CSV/TSV/TXT
        - XLSX/XLSM
        - SQLite
        - SQLAlchemy database
        - Parquet
        - DataFrame API
        - Không liên quan I/O
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Hệ điều hành
      description: Windows 10/11, Ubuntu/macOS và kiến trúc nếu liên quan.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Cách tái hiện tối thiểu
      description: Dùng CSV/code synthetic nhỏ; redact URI và path nhạy cảm.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Kết quả thực tế
      description: Chỉ dán lỗi/report đã kiểm tra không chứa raw data hoặc credential.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Bối cảnh bổ sung
      description: Config tối thiểu đã redact, kiểm tra đã thử, regression hay không.
