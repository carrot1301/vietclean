name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development checks
        run: python -m pip install -e ".[dev]"

      - name: Test
        if: matrix.python-version != '3.12'
        run: python -m pytest

      - name: Test with coverage
        if: matrix.python-version == '3.12'
        run: >-
          python -m pytest
          --cov=vietclean
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=json:coverage.json
          --cov-fail-under=85

      - name: Cleaning and security core coverage
        if: matrix.python-version == '3.12'
        run: python tools/check_core_coverage.py coverage.json --minimum 90

      - name: Ruff
        if: matrix.python-version == '3.12'
        run: ruff check src tests tools benchmarks

      - name: Mypy core
        if: matrix.python-version == '3.12'
        run: mypy src/vietclean

      - name: Bandit high-severity findings
        if: matrix.python-version == '3.12'
        run: bandit -q -lll -r src/vietclean

      - name: Audit installed dependencies
        if: matrix.python-version == '3.12'
        run: |
          python -m pip freeze --exclude-editable > "${RUNNER_TEMP}/audit-requirements.txt"
          pip-audit --strict --requirement "${RUNNER_TEMP}/audit-requirements.txt"

      - name: Audit runtime dependency licenses
        if: matrix.python-version == '3.12'
        run: python tools/check_dependency_licenses.py

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Build sdist and wheel
        if: matrix.python-version == '3.12'
        run: python -m build

  cross-platform-smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core and test runner
        run: python -m pip install -e "." pytest

      - name: CLI and I/O smoke tests
        run: |
          python -m vietclean --help
          python -m pytest tests/test_cli.py tests/test_io.py
          python -m pip check
