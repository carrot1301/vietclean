name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing reviewed tag in the form vMAJOR.MINOR.PATCH
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select manual release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: git checkout --detach "refs/tags/${RELEASE_TAG}"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify repository-specific release governance
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: python tools/check_release_governance.py --tag "${RELEASE_TAG}"

      - name: Install release checks
        run: python -m pip install -e ".[dev]"

      - name: Test and coverage gate
        run: >-
          python -m pytest
          --cov=vietclean
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=85

      - name: Cleaning and security core coverage
        run: python tools/check_core_coverage.py coverage.json --minimum 90

      - name: Static and dependency gates
        run: |
          ruff check src tests tools benchmarks
          mypy src/vietclean
          bandit -q -lll -r src/vietclean
          python -m pip freeze --exclude-editable > "${RUNNER_TEMP}/audit-requirements.txt"
          pip-audit --strict --requirement "${RUNNER_TEMP}/audit-requirements.txt"
          python tools/check_dependency_licenses.py
          python -m pip check

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout release ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select manual release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: git checkout --detach "refs/tags/${RELEASE_TAG}"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Build wheel and source distribution
        run: |
          python -m pip install "build>=1,<2"
          python -m build

      - name: Reject sensitive or unsafe release members
        run: python tools/check_release_artifacts.py dist/vietclean-*.whl dist/vietclean-*.tar.gz

      - name: Resolve isolated runtime and generate platform lock
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --upgrade pip
          .release-venv/bin/python -m pip install dist/vietclean-*.whl
          .release-venv/bin/python -m pip freeze --exclude vietclean > dist/resolved-linux-py312.txt
          python -m pip download --only-binary=:all: \
            --requirement dist/resolved-linux-py312.txt \
            --dest .release-wheelhouse
          python tools/create_hash_lock.py .release-wheelhouse \
            --output dist/requirements-linux-py312.lock
          python -m pip download --only-binary=:all: --require-hashes \
            --requirement dist/requirements-linux-py312.lock \
            --dest .release-lock-verification

      - name: Generate SPDX SBOM
        run: >-
          .release-venv/bin/python tools/generate_spdx_sbom.py
          --root-package vietclean
          --artifact $(find dist -maxdepth 1 -name 'vietclean-*.whl' -print -quit)
          --output dist/vietclean.spdx.json

      - name: Generate release checksums
        run: |
          cd dist
          sha256sum vietclean-*.whl vietclean-*.tar.gz requirements-linux-py312.lock \
            resolved-linux-py312.txt vietclean.spdx.json > SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --verify-tag --generate-notes \
              --title "VietClean ${RELEASE_TAG}"
          fi
          gh release upload "${RELEASE_TAG}" dist/vietclean-*.whl dist/vietclean-*.tar.gz \
            dist/requirements-linux-py312.lock dist/resolved-linux-py312.txt \
            dist/vietclean.spdx.json dist/SHA256SUMS --clobber
