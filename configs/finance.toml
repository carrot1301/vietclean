version = 1
profile = "finance"
strict = true
locale = "vi_VN"

[text]
unicode_form = "NFC"
repair_mojibake = true
remove_invisible = true
line_breaks = "keep"
trim = true

[type_conversion]
minimum_success_rate = 0.95
day_first = true
decimal_separator = ","
thousands_separator = "."
currency = "VND"
timezone_policy = "preserve"
min_year = 1990
max_year = 2100
excel_serial = true
invalid = "keep"

[duplicates]
enabled = false
action = "report_only"
subset = ["transaction_id"]
keep = "first"

[outliers]
enabled = true
methods = ["iqr"]
columns = ["amount", "debit", "credit", "balance"]
action = "report_only"

[domain_rules]
enabled = true
mode = "report_only"
absolute_tolerance = 0.01
relative_tolerance = 0.000001

[columns.transaction_id]
type = "identifier"
required = true
missing_strategy = "flag_only"
flag_column = "transaction_id_was_missing"

[columns.transaction_date]
type = "date"
required = true
invalid = "keep"

[columns.account_code]
type = "identifier"
invalid = "keep"

[columns.amount]
type = "currency"
currency = "VND"
invalid = "keep"

[columns.debit]
type = "currency"
currency = "VND"
min = 0
invalid = "keep"

[columns.credit]
type = "currency"
currency = "VND"
min = 0
invalid = "keep"

[columns.balance]
type = "currency"
currency = "VND"
invalid = "keep"

[columns.currency]
type = "category"
allowed = ["VND", "USD", "EUR", "GBP", "JPY", "CNY"]
invalid = "keep"
